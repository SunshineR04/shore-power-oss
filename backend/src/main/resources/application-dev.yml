spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET:PleaseSetYourOwnSecretKeyAtLeast32Bytes!!}

logging:
  level:
    com.shorepower: debug

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
