spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never

jwt:
  # 开发环境也要求显式设置 JWT_SECRET（可复制 .env.example 后填写），缺失/过短时应用拒绝启动
  secret: ${JWT_SECRET}

logging:
  level:
    com.shorepower: debug
    # MyBatis SQL（含参数）仅在 dev 输出
    com.shorepower.mapper: debug

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
