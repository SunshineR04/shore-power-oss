server:
  port: 8088

spring:
  jackson:
    time-zone: Asia/Shanghai
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shorepower?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J（生产不打印；dev profile 下由 logging.level 控制 debug 输出）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  # 过期时间可配置（毫秒），默认 2 小时，便于演示环境测试过期行为
  expiration: ${JWT_EXPIRATION:7200000}

management:
  endpoints:
    web:
      exposure:
        # 仅暴露健康检查端点；生产建议通过 Spring Security 保护
        include: health,info
  endpoint:
    health:
      show-details: never
